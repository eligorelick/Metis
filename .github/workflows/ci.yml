name: CI

# A pull request runs once for each push. Without the branch filter every push
# to a pull request branch ran the whole workflow twice.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check:dependencies
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - run: npm run audit:security

  product:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:integration
      - run: npm run test:coverage

  # Preserve the branch-protection name and fail if either parallel lane fails
  # or is cancelled/skipped. No second installation or test run in this job.
  full:
    needs: [checks, product]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: test '${{ needs.checks.result }}' = success && test '${{ needs.product.result }}' = success

  windows-smoke:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:product
      - run: npm run test:integration
